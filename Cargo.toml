[workspace]
resolver = "2"
members = [
    "crates/zibra-core",
    "crates/zibra-sources",
    "crates/zibra-reader",
    "crates/zibra-app",
]

[workspace.package]
version = "2.1.0"
edition = "2021"
authors = ["Jhon Naji <U1M>"]
license = "GPL-3.0-or-later"
repository = "https://github.com/zeravrix/ZIBRA-RS"

[workspace.dependencies]
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "cookies", "gzip", "brotli", "stream", "rustls-tls"] }
scraper = "0.20"
url = "2.5"
urlencoding = "2.1"
regex = "1.10"
once_cell = "1.19"
async-trait = "0.1"
rusqlite = { version = "0.32", features = ["bundled"] }
zip = { version = "2.2", default-features = false, features = ["deflate"] }
crc32fast = "1.4"
sha2 = "0.10"
hmac = "0.12"
hkdf = "0.12"
p256 = { version = "0.13", features = ["ecdh"] }
aes-gcm = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
base64 = "0.22"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif", "bmp"] }
imagesize = "0.13"
moka = { version = "0.12", features = ["sync"] }
parking_lot = "0.12"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"
uuid = { version = "1.10", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "persistence", "x11", "wayland"] }
egui = "0.29"
egui_extras = { version = "0.29", features = ["all_loaders", "image"] }

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
